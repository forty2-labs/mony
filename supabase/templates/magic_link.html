<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ececec;
      font-family: Manrope, Helvetica, Arial, sans-serif;
      color: #112320;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 24px; padding: 32px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 24px; font-size: 22px; font-weight: 700; color: #1b3530">
                  mony
                </p>
                <h1 style="margin: 0 0 12px; font-size: 20px; font-weight: 600">Sign in to mony</h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6">
                  Use the button below to sign in. The link works once, in any browser, and expires
                  soon.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=magiclink"
                    style="
                      display: inline-block;
                      background: #c7f269;
                      color: #112320;
                      text-decoration: none;
                      font-weight: 600;
                      padding: 12px 24px;
                      border-radius: 999px;
                    "
                    >Sign in</a
                  >
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5b6b68">
                  If you didn’t ask to sign in, you can ignore this email. Nobody can sign in
                  without this link.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
