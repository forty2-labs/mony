<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="A private, local-first personal financial operating system." />
    <title>Vault — Expense Tracker</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of incorrect theme.
      (function () {
        try {
          var stored = localStorage.getItem('vault.theme') || 'system';
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var dark = stored === 'dark' || (stored === 'system' && mql.matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
